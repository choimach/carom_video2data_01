<title>캐롬 공략 조언판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700&family=Noto+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #e8ebe7; --surface: #fbfcfa; --sunk: #dde3dd;
    --ink: #17211b; --soft: #55625a; --faint: #8b968e; --line: #cad2ca;
    --cloth: #2f6b52; --cloth-line: #58917a; --wood: #6f5334;
    --good: #2f6b52; --warn: #b06a1f;
    --ball-white: #f6f4ed; --ball-yellow: #e0a80f; --ball-red: #b23a26;
    --track: #f6f4ed;
    --shadow: 0 1px 3px rgba(23, 33, 27, .1);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground: #10150f; --surface: #1a211b; --sunk: #141a15;
      --ink: #e6ebe4; --soft: #a3b0a6; --faint: #748077; --line: #2c352d;
      --cloth: #1f4736; --cloth-line: #3d6b56; --wood: #4a3722;
      --good: #6fbf96; --warn: #d79a4a; --shadow: 0 1px 3px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --ground: #10150f; --surface: #1a211b; --sunk: #141a15;
    --ink: #e6ebe4; --soft: #a3b0a6; --faint: #748077; --line: #2c352d;
    --cloth: #1f4736; --cloth-line: #3d6b56; --wood: #4a3722;
    --good: #6fbf96; --warn: #d79a4a; --shadow: 0 1px 3px rgba(0,0,0,.45);
  }

  body { margin: 0; background: var(--ground); color: var(--ink);
         font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px 64px; }
  header { padding-block: 32px 14px; display: grid; gap: 6px; }
  h1 { font-family: "Gothic A1", "Noto Sans KR", sans-serif; font-weight: 700;
       font-size: clamp(24px, 4vw, 32px); margin: 0; letter-spacing: -.02em; }
  .step { margin: 0; color: var(--soft); }
  .step b { color: var(--ink); font-weight: 500; }

  .table-card { background: var(--surface); border: 1px solid var(--line);
                border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  svg.table { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         padding: 11px 14px; border-top: 1px solid var(--line); }
  .bar .label { font-size: 13px; color: var(--soft); margin-right: 2px; }
  button {
    font: 500 14px/1 "Noto Sans KR", sans-serif; padding: 10px 13px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  button.run { background: var(--cloth); border-color: var(--cloth); color: #fff; font-weight: 700; }
  button.run:disabled { background: var(--sunk); border-color: var(--line); color: var(--faint); }
  .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block;
            border: 1px solid rgba(0,0,0,.35); margin-right: 6px; vertical-align: -1px; }
  :focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }

  .choices { display: grid; gap: 12px; margin-top: 16px; align-items: stretch; }
  @media (min-width: 720px) { .choices { grid-template-columns: 1.2fr 1fr; } }
  .best { position: relative; border-width: 2px; border-color: var(--cloth); }
  .best .badge {
    font: 700 11px/1 "Noto Sans KR", sans-serif; letter-spacing: .04em;
    color: var(--surface); background: var(--cloth); border-radius: 99px;
    padding: 5px 9px; align-self: start; width: fit-content;
  }
  .manual {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 8px; align-content: start;
  }
  .manual label { font-size: 13px; color: var(--soft); }
  .manual select {
    font: 400 14px "Noto Sans KR", sans-serif; padding: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%;
  }
  .choice {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 6px;
    cursor: pointer; text-align: left; font-family: inherit;
  }
  .choice[aria-pressed="true"] { border-color: var(--ink); border-width: 2px; padding: 11px 13px; }
  .choice .name { font-family: "Gothic A1", sans-serif; font-weight: 700; font-size: 19px; }
  .choice .count { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--soft);
                   font-variant-numeric: tabular-nums; }
  .choice .thin { color: var(--warn); }
  .detail { margin-top: 14px; background: var(--surface); border: 1px solid var(--line);
            border-radius: 10px; padding: 14px; font-size: 13.5px; color: var(--soft); display: none; }
  .detail.on { display: block; }
  .detail b { color: var(--ink); font-weight: 500; }
  .plates { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0 4px; }
  .plate {
    background: var(--sunk); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px 8px; display: grid; gap: 6px; flex: 1 1 210px; min-width: 0;
  }
  .plate svg { width: 100%; height: auto; display: block; }
  .plate .cap {
    font: 700 11px/1 "Gothic A1", sans-serif; letter-spacing: .06em; color: var(--faint);
  }
  .plate .said { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
  footer { margin-top: 22px; font-size: 12.5px; color: var(--faint); }
  .feedback {
    margin-top: 16px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); padding: 14px;
    display: grid; gap: 9px;
  }
  .feedback h2 { font-family: "Gothic A1", sans-serif; font-weight: 700; font-size: 17px; margin: 0; }
  .feedback p { margin: 0; font-size: 13px; color: var(--soft); }
  .feedback textarea {
    font: 400 13.5px/1.6 "Noto Sans KR", sans-serif; padding: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--sunk); color: var(--ink);
    min-height: 88px; resize: vertical; width: 100%; box-sizing: border-box;
  }
  .feedback-row { display: flex; gap: 10px; align-items: center; }
  #copied { font-size: 12.5px; color: var(--good); }
</style>

<div class="wrap">
  <header>
    <h1>캐롬 공략 조언판</h1>
    <p class="step" id="step"></p>
  </header>

  <div class="table-card">
    <svg class="table" id="table" viewBox="-150 -150 3144 1722" role="img"
         aria-label="국제식 대대. 눌러서 공을 놓습니다."></svg>
    <div class="bar">
      <span class="label">수구</span>
      <button data-cue="white" type="button"><span class="swatch" style="background:var(--ball-white)"></span>흰공</button>
      <button data-cue="yellow" type="button"><span class="swatch" style="background:var(--ball-yellow)"></span>노란공</button>
      <span style="flex:1 1 auto"></span>
      <span class="label" style="margin-left:6px">1적구</span>
      <span id="first-buttons" style="display:contents"></span>
      <button data-face="any" type="button" aria-pressed="true">면 자동</button>
      <button data-face="left" type="button">왼쪽</button>
      <button data-face="right" type="button">오른쪽</button>
      <span style="flex:1 1 100%; height:0"></span>
      <button id="play" type="button" disabled>재생</button>
      <button id="clear" type="button">다시 놓기</button>
      <button id="run" class="run" type="button">실행</button>
    </div>
  </div>

  <div class="choices" id="choices"></div>
  <div class="detail" id="detail"></div>

  <section class="feedback">
    <h2>이 답이 어떤가요</h2>
    <p>틀린 점을 적어 주세요. 어느 공략이 왜 이상한지, 실제로는 무엇을 치시는지 —
      그 한 줄이 순위 계산을 고치는 근거가 됩니다.</p>
    <textarea id="comment" placeholder="예) 1번 추천은 키스가 난다. 실제로는 빨간공 오른쪽을 얇게 맞혀 뒤돌리기로 친다."></textarea>
    <div class="feedback-row">
      <button id="copy" type="button">결과 복사</button>
      <span id="copied"></span>
    </div>
  </section>
  <footer id="footer"></footer>
</div>

<script src="sim.js"></script>
<script id="data" type="application/json">__DATA__</script>
<script>
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const L = 2844, W = 1422, R = 30.75, NS = "http://www.w3.org/2000/svg";
  const K = 40, ORDER = ["white", "yellow", "red"];
  const NAMES = { white: "흰공", yellow: "노란공", red: "빨간공" };
  const SHORT = new Set(["left", "right"]);
  const NOTES = {
    "뒤돌리기": "중·하단에 회전 1.5~2팁, 강하지 않게. 1포인트 거리는 얇게. 짧게는 1포인트를 넘지 않으니 그보다 멀면 길게를 택한다.",
    "옆돌리기": "상단으로 ½(45도)을 맞추고 두께는 일정하게, 나머지는 회전으로 조절. 살살 치면 짧아지고 세게 치면 길어진다.",
    "앞돌리기": "옆돌리기가 어렵고 2적구가 1~2쿠션 지점에 있을 때. 중단~중하단, 부드럽게, 회전 많이.",
    "빗겨치기": "걸어치기와 상극이라 걸어치기가 힘들면 이쪽이 쉽다. 최대 회전이면 입사각=반사각.",
    "걸어치기": "빗겨치기가 힘들 때 쉬워진다. 회전 많이 주고 거의 정면을 맞히는 느낌으로.",
    "뱅크샷": "무회전은 생각보다 앞을(공 1½~2개 앞) 겨냥한다. 1적구가 공 하나 이상 떨어져 있으면 세게 타격.",
  };

  let layout = {};           // 놓인 공
  let cue = "white";
  let result = null;         // 실행 결과
  let picked = null;
  let playing = null;   // {frame, timer}
  let wantFirst = "any";   // 1적구: any | 공 이름
  let wantFace = "any";    // 맞히는 면: any | left | right

  const el = (parent, tag, attrs) => {
    const node = document.createElementNS(NS, tag);
    for (const key in attrs) node.setAttribute(key, attrs[key]);
    parent.appendChild(node);
    return node;
  };
  const placed = () => ORDER.filter((c) => layout[c]);
  const next = () => ORDER.find((c) => !layout[c]);

  function features(place, cueColour) {
    const c = place[cueColour];
    const others = ORDER.filter((k) => k !== cueColour).map((k) => place[k]);
    const gap = (p) => Math.hypot(p[0] - c[0], p[1] - c[1]);
    const [near, away] = gap(others[0]) <= gap(others[1]) ? others : [others[1], others[0]];
    const room = (p) => [Math.min(p[0], L - p[0]), Math.min(p[1], W - p[1])];
    const toNear = [near[0] - c[0], near[1] - c[1]];
    const toFar = [away[0] - c[0], away[1] - c[1]];
    const deg = (y, x) => Math.atan2(y, x) * 180 / Math.PI;
    return [
      Math.hypot(toNear[0], toNear[1]), Math.hypot(toFar[0], toFar[1]),
      Math.hypot(away[0] - near[0], away[1] - near[1]),
      deg(toNear[0] * toFar[1] - toNear[1] * toFar[0], toNear[0] * toFar[0] + toNear[1] * toFar[1]),
      deg(toNear[1], toNear[0]), deg(toFar[1], toFar[0]),
      ...room(c), ...room(near), ...room(away),
    ];
  }

  // 선수 배치를 기준 사분면으로 돌리는 변환. 각도도 같은 변환을 받아야 한다:
  // 짧은 축 뒤집기는 각을 180−θ로, 긴 축 뒤집기는 −θ로 바꾼다.
  function frameOf() {
    const at = layout[cue];
    const flipY = at[0] > L / 2, flipX = at[1] > W / 2;
    const turn = (p) => [flipY ? L - p[0] : p[0], flipX ? W - p[1] : p[1]];
    const turnAngle = (deg) => {
      let out = deg;
      if (flipY) out = 180 - out;
      if (flipX) out = -out;
      return ((out % 360) + 360) % 360;
    };
    return { flipX, flipY, turn, turnAngle };
  }

  // 프로들이 이 배치에서 무엇을 골랐나 — 경로별 무게와 그들이 실제로 친 방향
  function fromPros() {
    const { turn } = frameOf();
    const canon = {};
    for (const key of ORDER) canon[key] = turn(layout[key]);
    const point = features(canon, cue).map((v, i) => (v - DATA.mean[i]) / DATA.std[i]);
    const near = DATA.plays.map((play) => {
      let sum = 0;
      for (let i = 0; i < point.length; i++) { const d = play.f[i] - point[i]; sum += d * d; }
      return { play, gap: Math.sqrt(sum) };
    }).sort((a, b) => a.gap - b.gap).slice(0, K);
    const weight = new Map(), rate = new Map();
    for (const item of near) {
      const key = `${item.play.route}|${item.play.near}|${item.play.face}`;
      weight.set(key, (weight.get(key) || 0) + 1);
      rate.set(key, (rate.get(key) || 0) + (item.play.scored ? 1 : 0));
    }
    return { weight, rate, total: near.length, near };
  }

  // 이 배치에서 실제로 득점하는 선을 찾는다. 경로 이름은 선생님 기준 그대로:
  // 1적구 전 쿠션이 있으면 걸어치기·뱅크샷, 단쿠션이 먼저면 2쿠션이 가까워지는지
  // 멀어지는지로 앞돌리기·빗겨치기, 장쿠션이 먼저면 같은 기준으로 옆·뒤돌리기.
  function nameRoute(shot, judged, aim, face) {
    // 선수의 기준: 1적구의 오른쪽 면을 맞고 오른쪽으로 돌면 옆돌리기(제각),
    // 반대면 뒤돌리기. "오른쪽으로 돈다"는 접촉 순간의 꺾임이 아니라 테이블을
    // 도는 방향이다 - 오른쪽 면을 맞으면 수구는 당장은 왼쪽으로 꺾인다.
    const balls = shot.events.filter((e) => e.kind === "ball");
    const first = balls[0];
    const opening = shot.events.filter((e) => e.kind === "cushion" && e.at < first.at);
    if (opening.length >= 2) return "뱅크샷";
    if (opening.length === 1) return "걸어치기";
    const after = shot.events.filter((e) => e.kind === "cushion" && e.at > first.at);
    if (!after.length) return null;
    const rails = after.map((e) => e.detail);
    if (rails.length >= 3 && rails[0] === rails[2]
        && (SHORT.has(rails[1]) !== SHORT.has(rails[0]))) return "되돌아오기";

    let area = 0;
    const path = shot.path;
    for (let i = 0; i < path.length - 1; i++) {
      const ax = path[i][0] - L / 2, ay = path[i][1] - W / 2;
      const bx = path[i + 1][0] - L / 2, by = path[i + 1][1] - W / 2;
      area += ax * by - ay * bx;
    }
    const circuitRight = area > 0;
    const sameHand = (face === "right") === circuitRight;
    const shortFirst = SHORT.has(rails[0]);
    if (sameHand) return shortFirst ? "앞돌리기" : "옆돌리기";
    return shortFirst ? "빗겨치기" : "뒤돌리기";
  }

  // 탐색은 수천 번의 시뮬레이션이라 한 번에 돌리면 화면이 몇 초씩 멈춘다.
  // 조금씩 끊어 돌리고 사이사이 브라우저에 차례를 넘긴다.
  // 세기는 강도로 말한다: 강도 1이 수구가 장축만큼 굴러가는 세기, n이면 그 n 배.
  // 밀리미터 매 초는 큐를 잡고 쓸 수 있는 말이 아니다. 프로 1335개 플레이를
  // 이 자로 읽으면 사분위가 3.2 / 4.4 / 5.6이고 90%가 7.3이라, 넷 다 실전
  // 범위 안이다.
  const STRENGTHS = [3.5, 4.5, 5.5, 7.0];
  const SPEEDS = STRENGTHS.map((s) => Math.round(SIM.speedFor(s)));
  // 당점: 좌우는 팁, 위아래는 거친 탐색에서 0으로 두고 정밀 탐색에서만 본다.
  const TIPS = [-3, -1.5, 0, 1.5, 3], TIPS_VERTICAL = [0, 2, -2];
  const COARSE = 2, FINE = 0.25, CHUNK = 120;
  const pause = () => new Promise((go) => setTimeout(go, 0));

  // 키스 — 계산한 줄이 실제로는 성립하지 않는 두 가지.
  //
  // 이 함수가 없는 채로 호출만 남아 있었다. 득점하는 줄을 처음 찾는 순간
  // ReferenceError가 나고 탐색 전체가 무너져서, 화면에는 언제나 "이 배치에서
  // 득점하는 선을 찾지 못했습니다"가 나왔다. 배치 탓이 아니었다.
  function kissed(shot, judged) {
    const balls = shot.events.filter((e) => e.kind === "ball");
    if (!balls.length) return false;
    const first = balls[0];
    const second = balls.find((e) => e.detail !== first.detail);
    if (!second) return false;
    // 적구끼리 부딪히면 2적구가 그린 자리에 없다 — 계산한 줄이 아니게 된다.
    if (shot.events.some((e) => e.kind === "kiss" && e.at <= second.at)) return true;
    // 수구가 1적구를 한 번 더 건드리고 가는 것도 키스다. 실제로는 여기서
    // 진로가 막히거나 세기가 죽어 남은 길을 가지 못한다.
    return balls.some((e) => e !== first && e.detail === first.detail && e.at < second.at);
  }

  function tryAngle(deg, speed, side, hits, counters, vertical = 0) {
    const rad = deg * Math.PI / 180;
    const aim = [Math.cos(rad), Math.sin(rad)];
    const shot = SIM.play(layout, cue, [aim[0] * speed, aim[1] * speed], side, vertical);
    const judged = SIM.judge(shot);
    const balls = shot.events.filter((e) => e.kind === "ball");
    const cushions = shot.events.filter((e) => e.kind === "cushion").length;
    const promising = balls.length > 0 && cushions >= 2;
    if (!judged.scored) return promising;
    if (kissed(shot, judged)) { counters.kisses++; return promising; }
    const target = layout[judged.first];
    const toBall = [target[0] - layout[cue][0], target[1] - layout[cue][1]];
    const face = (aim[0] * toBall[1] - aim[1] * toBall[0]) > 0 ? "left" : "right";
    // 두께 = 1 − (수구 진행선과 적구 중심 사이 수직 거리) / 공 지름. 정면이 1,
    // 스치면 0. 선수가 쓰는 말이 이것이므로 화면에도 이것으로 적는다.
    const offset = Math.abs(aim[0] * toBall[1] - aim[1] * toBall[0]);
    const thickness = Math.max(0, Math.min(1, 1 - offset / (SIM.RADIUS * 2)));
    if (wantFace !== "any" && face !== wantFace) return promising;
    if (wantFirst !== "any" && judged.first !== wantFirst) return promising;
    const route = nameRoute(shot, judged, aim, face);
    if (!route) return promising;
    const way = shot.paths[judged.first] || [];
    let pushed = 0;
    for (let i = 1; i < way.length; i++) {
      pushed += Math.hypot(way[i][0] - way[i - 1][0], way[i][1] - way[i - 1][1]);
    }
    hits.push({ deg, speed, side, vertical, route, shot, judged, face, pushed, thickness });
    return true;
  }

  // 각도를 0도부터 360도까지 훑으면 대부분이 1적구를 스치지도 못하고 버려진다.
  // 대신 "어느 공을, 어느 면을, 얼마나 두껍게" 맞힐지로 훑는다. 그러면 모든
  // 시도가 반드시 1적구에 맞고, 선수가 실제로 고르는 것과 같은 축이 된다.
  // 겨냥선에서 벗어난 각도는 접촉에 필요한 어긋남에서 바로 나온다.
  const THICKNESS_STEPS = 26, SEEDS = 12, SEED_SPAN = 8;

  function contactJobs() {
    const jobs = [];
    const from = layout[cue];
    for (const colour of ORDER) {
      if (colour === cue) continue;
      const to = layout[colour];
      const straight = Math.atan2(to[1] - from[1], to[0] - from[0]) * 180 / Math.PI;
      const reach = Math.hypot(to[0] - from[0], to[1] - from[1]);
      if (reach < 70) continue;
      for (let i = 0; i <= THICKNESS_STEPS; i++) {
        // 어긋남 0이면 정면, 공 지름만큼이면 스치는 끝이다.
        const offset = (i / THICKNESS_STEPS) * SIM.RADIUS * 2;
        const swing = Math.asin(Math.min(1, offset / reach)) * 180 / Math.PI;
        for (const hand of (i === 0 ? [0] : [1, -1])) {
          const deg = ((straight + hand * swing) % 360 + 360) % 360;
          for (const speed of SPEEDS) {
            for (const side of TIPS) jobs.push([deg, speed, side]);
          }
        }
      }
    }
    return jobs;
  }

  function seedJobs(near) {
    const { turnAngle } = frameOf();
    const jobs = [];
    const seen = new Set();
    for (const item of near.slice(0, 8)) {
      const play = item.play;
      if (play.aim === null || play.speed === null) continue;
      const aim = turnAngle(play.aim);
      // 프로가 친 초속을 강도로 읽고, 반 칸 눈금에 맞춰 위아래로 한 칸씩.
      const at = SIM.strengthOf(play.speed);
      const speeds = [at - 0.5, at, at + 0.5]
        .map((s) => Math.round(Math.min(7, Math.max(1, s)) * 2) / 2)
        .map((s) => Math.round(SIM.speedFor(s)));
      for (const speed of new Set(speeds)) {
        for (const side of TIPS) {
          for (let d = -4; d <= 4; d += FINE) {
            const deg = Math.round((((aim + d) % 360) + 360) % 360 / FINE) * FINE;
            const key = `${deg}:${speed}:${side}`;
            if (seen.has(key)) continue;
            seen.add(key);
            jobs.push([deg, speed, side]);
          }
        }
      }
    }
    return jobs;
  }

  async function solve(onProgress, near) {
    const hits = [], counters = { kisses: 0 };
    // 1) 두께로 훑기 — 모든 시도가 1적구에 맞는다.
    const contact = contactJobs();
    const promising = [];
    for (let i = 0; i < contact.length; i++) {
      const [deg, speed, side] = contact[i];
      if (tryAngle(deg, speed, side, hits, counters)) promising.push(contact[i]);
      if (i % CHUNK === CHUNK - 1) { onProgress(0.45 * i / contact.length); await pause(); }
    }
    // 2) 그중 될 뻔한 자리 둘레만 0.25도로 다시 — 득점 창이 그만큼 좁다.
    const seen = new Set(contact.map(([d, s, x]) => `${d}:${s}:${x}`));
    const around = [];
    for (const [deg, speed, side] of promising) {
      for (let d = -1.5; d <= 1.5; d += FINE) {
        const at = Math.round((((deg + d) % 360 + 360) % 360) / FINE) * FINE;
        const key = `${at}:${speed}:${side}`;
        if (seen.has(key)) continue;
        seen.add(key);
        around.push([at, speed, side]);
      }
    }
    for (let i = 0; i < around.length; i++) {
      tryAngle(around[i][0], around[i][1], around[i][2], hits, counters);
      if (i % CHUNK === CHUNK - 1) { onProgress(0.45 + 0.25 * i / around.length); await pause(); }
    }
    // 밀어치기와 끌어치기는 그 다음이다. 중단 당점으로 이미 여러 줄이 나왔으면
    // 굳이 세 배로 돌리지 않는다 — 기다리는 시간이 그만큼 늘어난다.
    if (hits.length < 8) {
      for (let i = 0; i < around.length; i++) {
        for (const vertical of TIPS_VERTICAL.slice(1)) {
          tryAngle(around[i][0], around[i][1], around[i][2], hits, counters, vertical);
        }
        if (i % CHUNK === CHUNK - 1) { onProgress(0.70 + 0.10 * i / around.length); await pause(); }
      }
    }
    // 3) 후보가 적을 때만, 프로가 실제로 친 방향 둘레를 더 본다. 두께 훑기가
    // 대개 충분하므로 이건 대비책이고, 매번 돌리면 그만큼 느려진다.
    const seeded = hits.length >= 5 ? []
      : seedJobs(near || []).filter(([d, s, x]) => !seen.has(`${d}:${s}:${x}`));
    for (let i = 0; i < seeded.length; i++) {
      tryAngle(seeded[i][0], seeded[i][1], seeded[i][2], hits, counters);
      if (i % CHUNK === CHUNK - 1) { onProgress(0.8 + 0.2 * i / seeded.length); await pause(); }
    }
    if (hits.length) return finish(hits, counters, "두께로 훑어");

    // 아무것도 없으면 전방위로 한 번 더.
    const jobs = [];
    for (const speed of SPEEDS) {
      for (const side of TIPS) {
        for (let deg = 0; deg < 360; deg += COARSE) jobs.push([deg, speed, side]);
      }
    }
    const fine = [];
    for (let i = 0; i < jobs.length; i++) {
      const [deg, speed, side] = jobs[i];
      if (tryAngle(deg, speed, side, hits, counters)) {
        // 거친 간격이 2도이므로 그 절반씩만 훑으면 빈틈 없이 덮인다.
        for (let d = -COARSE / 2; d <= COARSE / 2; d += FINE) {
          const at = Math.round(((deg + d + 360) % 360) / FINE) * FINE;
          if (Math.abs(at - deg) > 1e-9) fine.push([at, speed, side]);
        }
      }
      if (i % CHUNK === CHUNK - 1) { onProgress(0.5 * i / jobs.length); await pause(); }
    }
    for (let i = 0; i < fine.length; i++) {
      tryAngle(fine[i][0], fine[i][1], fine[i][2], hits, counters);
      if (i % CHUNK === CHUNK - 1) { onProgress(0.5 + 0.5 * i / fine.length); await pause(); }
    }

    return finish(hits, counters, "전방위 탐색");
  }

  function finish(hits, counters, how) {
    const key = (h, deg) => `${h.speed}:${h.side}:${Math.round(deg / FINE) * FINE}`;
    const byKey = new Map();
    for (const hit of hits) byKey.set(key(hit, hit.deg), hit);
    for (const hit of hits) {
      let room = FINE;
      for (const dir of [FINE, -FINE]) {
        let at = hit.deg + dir;
        while (byKey.has(key(hit, (at + 360) % 360))) { room += FINE; at += dir; }
      }
      hit.room = Math.round(room * 100) / 100;
    }
    const best = new Map();
    for (const hit of hits) {
      const id = `${hit.route}|${hit.judged.first}|${hit.face}`;
      const kept = best.get(id);
      if (!kept || hit.room > kept.room) best.set(id, hit);
    }
    return { best, kisses: counters.kisses, how };
  }

  async function advise(onProgress) {
    const pros = fromPros();
    const { best: lines, kisses, how } = await solve(onProgress, pros.near);
    const cueAt = layout[cue];
    const gapTo = (colour) => Math.hypot(layout[colour][0] - cueAt[0], layout[colour][1] - cueAt[1]);
    const routes = [];
    for (const [key, hit] of lines) {
      const first = hit.judged.first;
      const other = ORDER.find((c) => c !== cue && c !== first);
      const isNear = gapTo(first) <= gapTo(other);
      const proKey = `${hit.route}|${isNear}|${hit.face}`;
      const chosen = pros.weight.get(proKey) || 0;
      const scored = pros.rate.get(proKey) || 0;
      // 몇 명이 골랐는지만 보고 몇 명이 넣었는지를 안 보던 것이 틀린 이유였다.
      // 같은 배치에서 셋이 고른 뱅크샷(하나 성공)이 셋이 고른 뒤돌리기(둘 성공)를
      // 이겼다. 성공률은 표본이 작아 0%와 100%가 흔하므로, 한 번의 성공과 한 번의
      // 실패를 미리 얹어 눌러 준다.
      const rate = (scored + 1) / (chosen + 2);
      routes.push({
        route: hit.route, key, hit, chosen, first, scored,
        proRate: chosen ? Math.round((scored / chosen) * 100) : null,
        // 프로가 고르고 또 넣은 공략이면서, 조준 여유가 넓고, 1적구를 덜 흔드는 것.
        score: (chosen + 0.5) * rate * hit.room / (1 + hit.pushed / 4000),
      });
    }
    routes.sort((a, b) => b.score - a.score);
    return { routes: routes.slice(0, 12), total: pros.total, tried: lines.size, kisses, how };
  }

  function render() {
    const svg = document.getElementById("table");
    svg.textContent = "";
    el(svg, "rect", { x: -150, y: -150, width: L + 300, height: W + 300, rx: 46, fill: "var(--wood)" });
    el(svg, "rect", { x: 0, y: 0, width: L, height: W, fill: "var(--cloth)" });
    for (let k = 1; k <= 7; k++) {
      const x = (L / 8) * k;
      el(svg, "circle", { cx: x, cy: -75, r: 15, fill: "var(--cloth-line)" });
      el(svg, "circle", { cx: x, cy: W + 75, r: 15, fill: "var(--cloth-line)" });
    }
    for (let k = 1; k <= 3; k++) {
      const y = (W / 4) * k;
      el(svg, "circle", { cx: -75, cy: y, r: 15, fill: "var(--cloth-line)" });
      el(svg, "circle", { cx: L + 75, cy: y, r: 15, fill: "var(--cloth-line)" });
    }

    const row = chosenRow();
    if (row) {
      const shot = row.hit.shot;
      for (const colour of ORDER) {
        if (colour === cue) continue;
        const way = shot.paths[colour];
        if (!way || way.length < 2) continue;
        const moved = Math.hypot(way[way.length - 1][0] - way[0][0], way[way.length - 1][1] - way[0][1]);
        if (moved < 20) continue;
        el(svg, "polyline", {
          points: way.map((p) => p.map(Math.round).join(",")).join(" "), fill: "none",
          stroke: `var(--ball-${colour})`, "stroke-width": 6, "stroke-dasharray": "16 12",
          "stroke-linecap": "round", opacity: .65,
        });
      }
      el(svg, "polyline", {
        points: shot.path.map((p) => p.map(Math.round).join(",")).join(" "), fill: "none",
        stroke: "var(--track)", "stroke-width": 9, "stroke-linecap": "round",
        "stroke-linejoin": "round", opacity: .9,
      });
      const rad = row.hit.deg * Math.PI / 180;
      const from = layout[cue];
      el(svg, "line", {
        x1: from[0], y1: from[1],
        x2: from[0] + Math.cos(rad) * 420, y2: from[1] + Math.sin(rad) * 420,
        stroke: "var(--track)", "stroke-width": 5, "stroke-dasharray": "18 14", opacity: .5,
      });
      for (const e of shot.events.filter((e) => e.kind === "cushion")) {
        el(svg, "circle", { cx: e.p[0], cy: e.p[1], r: 13, fill: "var(--track)", opacity: .75 });
      }
      // 어디서 시작해 어디서 끝나는지 글자로 박아둔다. 궤적이 처음 배치가 아니라
      // 끝난 배치에 붙어 보인다는 지적이 있었는데, 그때 눈으로 가릴 수 있어야 한다.
      const head = shot.path[0], tail = shot.path[shot.path.length - 1];
      const tag = (at, text, colour) => {
        const mark = el(svg, "text", { x: at[0], y: at[1] - 58, "text-anchor": "middle",
                                       fill: colour, "font-size": 60, "font-weight": 700,
                                       "font-family": "Gothic A1, sans-serif" });
        mark.textContent = text;
      };
      tag(head, "시작", "var(--track)");
      tag(tail, "끝", "var(--ball-yellow)");
      for (const colour of ORDER) {
        const at = shot.rest[colour];
        if (!at) continue;
        el(svg, "circle", { cx: at[0], cy: at[1], r: R, fill: "none",
                            stroke: `var(--ball-${colour})`, "stroke-width": 5,
                            "stroke-dasharray": "9 7", opacity: .95 });
      }
      if (playing) {
        for (const colour of ORDER) {
          const way = shot.paths[colour];
          const at = way[Math.min(playing.frame, way.length - 1)];
          el(svg, "circle", { cx: at[0], cy: at[1], r: R, fill: `var(--ball-${colour})`,
                              stroke: "rgba(0,0,0,.5)", "stroke-width": 4 });
        }
      }
    }

    for (const colour of ["red", "yellow", "white"]) {
      if (!layout[colour]) continue;
      const at = layout[colour];
      const ring = colour === cue
        ? el(svg, "circle", { cx: at[0], cy: at[1], r: R + 26, fill: "none",
                              stroke: "var(--ball-white)", "stroke-width": 6, opacity: .8 })
        : null;
      const ball = el(svg, "circle", { cx: at[0], cy: at[1], r: R, fill: `var(--ball-${colour})`,
                                       stroke: "rgba(0,0,0,.45)", "stroke-width": 4,
                                       opacity: playing ? .25 : 1, style: "cursor:grab" });
      drag(ball, colour, svg, ring);
    }
    paint();
  }

  const chosenRow = () =>
    (result && picked) ? result.routes.find((r) => r.key === picked) : null;

  // 3/4, 1/2, 1/8처럼 선수가 쓰는 분수로.
  const asThickness = (t) => {
    const eighths = Math.round(t * 8);
    if (eighths <= 0) return "스치듯";
    if (eighths >= 8) return "온 두께";
    const halves = [[4, "1/2"], [2, "1/4"], [6, "3/4"]].find(([e]) => e === eighths);
    return halves ? halves[1] : `${eighths}/8`;
  };

  // 당점을 선수가 듣는 말로: 시계 방향과 팁.
  function asTip(side, vertical) {
    if (!side && !vertical) return "정중앙";
    const clock = [[0, 1, "12시"], [1, 1, "1시반"], [1, 0, "3시"], [1, -1, "4시반"],
                   [0, -1, "6시"], [-1, -1, "7시반"], [-1, 0, "9시"], [-1, 1, "10시반"]]
      .find(([x, y]) => x === Math.sign(side) && y === Math.sign(vertical));
    const tips = Math.max(Math.abs(side), Math.abs(vertical));
    return `${clock ? clock[2] : ""} ${tips % 1 ? tips.toFixed(1) : tips}팁`.trim();
  }


  // 선수가 실제로 보는 두 가지: 수구가 1적구를 얼마나 덮는가, 큐가 수구의 어디를
  // 때리는가. 도(度)나 라디안이 아니라 이 두 그림이 큐를 겨눌 때 머릿속에 있는
  // 것이므로, 숫자와 나란히 그려 둔다.
  let plateNumber = 0;

  function thicknessPlate(row) {
    // 겨냥선과 적구 중심 사이의 수직 거리. 두께 1이면 0(정면), 0이면 지름.
    const gap = SIM.DIAMETER * (1 - Math.max(0, Math.min(1, row.hit.thickness)));
    // 왼쪽 면을 맞히면 수구가 적구의 왼쪽으로 치우쳐 지나간다.
    const x = row.hit.face === "left" ? -gap : gap;
    const R = SIM.RADIUS, id = `ov${++plateNumber}`;
    const cueColour = cue === "white" ? "var(--ball-white)" : "var(--ball-yellow)";
    const firstColour = row.first === "red" ? "var(--ball-red)"
      : row.first === "white" ? "var(--ball-white)" : "var(--ball-yellow)";
    return `<div class="plate">
      <span class="cap">두께 — 겹치는 만큼</span>
      <svg viewBox="-100 -46 200 92" role="img"
           aria-label="수구가 1적구를 ${asThickness(row.hit.thickness)} 덮습니다">
        <defs><clipPath id="${id}"><circle cx="${x}" cy="0" r="${R}"/></clipPath></defs>
        <circle cx="0" cy="0" r="${R}" fill="${firstColour}"
                stroke="rgba(0,0,0,.45)" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="${R}" clip-path="url(#${id})"
                fill="var(--cloth)" opacity=".55"/>
        <circle cx="${x}" cy="0" r="${R}" fill="${cueColour}" fill-opacity=".35"
                stroke="rgba(0,0,0,.55)" stroke-width="1.2" stroke-dasharray="4 3"/>
        <line x1="0" y1="-42" x2="0" y2="42" stroke="var(--faint)" stroke-width=".8"/>
        <line x1="${x}" y1="-42" x2="${x}" y2="42" stroke="var(--faint)" stroke-width=".8"/>
        ${Math.abs(x) > 2 ? `<line x1="0" y1="38" x2="${x}" y2="38"
              stroke="var(--ink)" stroke-width="1.4"/>` : ""}
      </svg>
      <span class="said">${asThickness(row.hit.thickness)} ·
        ${NAMES[row.first]} ${row.hit.face === "left" ? "왼쪽" : "오른쪽"}면 ·
        빗나감 ${Math.round(gap)} mm</span>
    </div>`;
  }

  function tipPlate(row) {
    const side = row.hit.side || 0, vertical = row.hit.vertical || 0;
    const R = SIM.RADIUS, T = SIM.TIP_MM;
    const cueColour = cue === "white" ? "var(--ball-white)" : "var(--ball-yellow)";
    const rings = [1, 2, 3].map((n) =>
      `<circle cx="0" cy="0" r="${n * T}" fill="none" stroke="var(--faint)"
               stroke-width=".7" stroke-dasharray="3 2.5"/>`).join("");
    return `<div class="plate">
      <span class="cap">당점 — 큐가 닿는 자리</span>
      <svg viewBox="-40 -40 80 80" role="img" aria-label="당점 ${asTip(side, vertical)}">
        <circle cx="0" cy="0" r="${R}" fill="${cueColour}"
                stroke="rgba(0,0,0,.45)" stroke-width="1.2"/>
        ${rings}
        <line x1="${-R}" y1="0" x2="${R}" y2="0" stroke="var(--faint)" stroke-width=".7"/>
        <line x1="0" y1="${-R}" x2="0" y2="${R}" stroke="var(--faint)" stroke-width=".7"/>
        <circle cx="${side * T}" cy="${-vertical * T}" r="6"
                fill="var(--cloth)" stroke="var(--surface)" stroke-width="1"/>
      </svg>
      <span class="said">${asTip(side, vertical)} · 1팁 ${T} mm · 큐 끝 12 mm</span>
    </div>`;
  }

  const label = (row) =>
    `${row.route} · ${NAMES[row.first]} ${row.hit.face === "left" ? "왼쪽" : "오른쪽"}면`;

  function paint() {
    const ready = placed().length === 3;
    firstBallButtons();
    document.getElementById("first-buttons").querySelectorAll("button")
      .forEach((b) => { b.disabled = !ready; });
    document.getElementById("run").disabled = !ready;
    document.getElementById("play").disabled = !chosenRow();
    document.getElementById("play").textContent = playing ? "재생 중…" : "재생";
    document.querySelectorAll("[data-cue]").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.cue === cue));
      b.disabled = !ready;
    });

    const step = document.getElementById("step");
    if (!ready) {
      step.innerHTML = `빈 테이블을 눌러 공을 놓으세요. 다음은 <b>${NAMES[next()]}</b>입니다.
        (${placed().length}/3) 놓은 공은 <b>끌어서 옮길 수 있습니다.</b>`;
    } else if (!result) {
      step.innerHTML = `수구를 고르고 <b>실행</b>을 누르세요. 이 배치에서 득점하는 공략을 찾아드립니다.`;
    } else {
      step.innerHTML = result.routes.length
        ? `득점하는 공략 ${result.routes.length}가지를 찾았습니다. 왼쪽이 추천, 오른쪽 목록에서 직접 고르실 수 있습니다.`
        : `이 배치에서는 득점하는 선을 찾지 못했습니다.`;
    }

    const box = document.getElementById("choices");
    const detail = document.getElementById("detail");
    box.textContent = "";
    if (!result) {
      detail.classList.remove("on");
      document.getElementById("footer").textContent = "";
      return;
    }
    if (!result.routes.length) {
      const limited = wantFirst !== "any" || wantFace !== "any";
      box.innerHTML = `<div class="manual" style="grid-column:1/-1">${limited
        ? "지정하신 조건으로는 득점하는 선을 찾지 못했습니다. 조건을 풀거나 공을 옮겨 보세요."
        : "이 배치에서 득점하는 선을 찾지 못했습니다. 공을 조금 옮겨 보세요."}</div>`;
      detail.classList.remove("on");
      return;
    }

    const best = result.routes[0];
    const card = document.createElement("button");
    card.className = "choice best";
    card.type = "button";
    card.setAttribute("aria-pressed", String(best.key === picked));
    card.innerHTML = `<span class="badge">가장 확률 높은 공략</span>
      <span class="name"></span>
      <span class="count">조준 여유 ${best.hit.room}° ·
        ${best.chosen ? `프로 ${best.chosen}／${result.total}명 · 그중 득점 ${best.proRate}%`
                      : '<span class="thin">프로가 고른 적 없음</span>'} ·
        두께 ${asThickness(best.hit.thickness)} · 강도 ${SIM.strengthOf(best.hit.speed).toFixed(1)} ·
        1적구 ${Math.round(best.hit.pushed)} mm 이동</span>`;
    card.querySelector(".name").textContent = label(best);
    card.onclick = () => { stopPlaying(); picked = best.key; render(); };
    box.appendChild(card);

    const manual = document.createElement("div");
    manual.className = "manual";
    manual.innerHTML = `<label for="other">다른 공략 (${result.routes.length}가지)</label>`;
    const pick = document.createElement("select");
    pick.id = "other";
    for (const row of result.routes) {
      const option = document.createElement("option");
      option.value = row.key;
      option.textContent = `${label(row)} — 두께 ${asThickness(row.hit.thickness)}`
        + ` · 강도 ${SIM.strengthOf(row.hit.speed).toFixed(1)}`
        + ` · 여유 ${row.hit.room}°`
        + (row.chosen ? ` · 프로 ${row.chosen}명` : " · 프로 0명")
        + ` · 1적구 ${Math.round(row.hit.pushed)} mm`;
      option.selected = row.key === picked;
      pick.appendChild(option);
    }
    pick.onchange = () => { stopPlaying(); picked = pick.value; render(); };
    manual.appendChild(pick);
    const note = document.createElement("div");
    note.style.cssText = "font-size:12.5px;color:var(--soft)";
    note.textContent = "여유가 넓고 프로가 많이 고른 순서입니다. 골라서 궤적을 비교해 보세요.";
    manual.appendChild(note);
    box.appendChild(manual);

    const row = chosenRow();
    if (row) {
      detail.classList.add("on");
      const strength = SIM.strengthOf(row.hit.speed).toFixed(1);
      const side = asTip(row.hit.side, row.hit.vertical || 0);
      detail.innerHTML = `<b>${label(row)}</b> — ${NOTES[row.route] || ""}
        <div class="plates">${thicknessPlate(row)}${tipPlate(row)}</div>
        그려진 선은 <b>이 배치에서</b> 시뮬레이터가 찾은 득점 궤적입니다.
        <b>두께 ${asThickness(row.hit.thickness)}</b>로 ${NAMES[row.first]}의
        ${row.hit.face === "left" ? "왼쪽" : "오른쪽"} 면을, <b>강도 ${strength}</b>
        (수구가 장축 ${strength}개만큼 굴러가는 세기),
        당점 <b>${side}</b>. 쿠션 <b>${row.hit.judged.rails.length}개</b>,
        1적구 <b>${Math.round(row.hit.pushed)} mm</b> 이동.
        시뮬레이터가 회전을 공의 상태로 들고 있으므로 당점을 팁으로 말합니다.
        영상 플레이 150개와 대조하면 1초 뒤 위치가 <b>253 mm</b> 어긋나고,
        이동거리는 실제의 <b>95%</b>, 쿠션 개수는 중앙값이 맞습니다. 공 하나가
        62 mm이니 253 mm는 네 개입니다 — <b>어느 쪽으로 도는 공략인지 보는
        그림이지, 그대로 겨눠서 맞는 처방이 아닙니다.</b>
        점선은 조준 방향, 흰 점은 쿠션에 닿는 자리,
        <b>색 점선은 적구가 굴러간 길</b>, <b>테두리만 있는 공이 멈추는 자리</b>입니다.
        <b>재생</b>을 누르면 실제 속도로 움직입니다.<br><br>
        <b>조준 여유 ${row.hit.room}°</b>는 좌우로 얼마나 빗나가도 득점하는지입니다.
        <b>어느 쪽으로 도는 공략인지 보여주는 그림이지 그대로 치면 되는 처방이 아닙니다.</b>`;
    } else {
      detail.classList.remove("on");
    }
    document.getElementById("footer").innerHTML =
      `${result.how ? `<b>${result.how}</b>에서 찾았습니다. ` : ""}${result.kisses ? `키스가 나는 선 <b>${result.kisses}개</b>는 빼고 보여드립니다. ` : ""}
       순위는 프로 27경기 ${DATA.plays.length}개 플레이 중 <b>이 배치와 가장 가까운 ${K}개</b>가 정하고,
       궤적은 <b>이 배치에서 직접 계산</b>합니다.`;
  }

  function point(event, svg) {
    const box = svg.getBoundingClientRect();
    const scale = (L + 300) / box.width;
    return [
      Math.max(R, Math.min(L - R, (event.clientX - box.left) * scale - 150)),
      Math.max(R, Math.min(W - R, (event.clientY - box.top) * scale - 150)),
    ];
  }

  function drag(ball, colour, svg, ring) {
    // The ball is moved by setting its own centre, not by redrawing the table.
    // Redrawing removes the very element the pointer is captured on, so the
    // first move was also the last: the ball jumped once and then let go.
    ball.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
      event.preventDefault();
      ball.setPointerCapture(event.pointerId);
      ball.style.cursor = "grabbing";
      const move = (e) => {
        const at = point(e, svg);
        layout[colour] = at;
        ball.setAttribute("cx", at[0]);
        ball.setAttribute("cy", at[1]);
        if (ring) { ring.setAttribute("cx", at[0]); ring.setAttribute("cy", at[1]); }
      };
      const up = () => {
        ball.removeEventListener("pointermove", move);
        ball.removeEventListener("pointerup", up);
        ball.removeEventListener("pointercancel", up);
        ball.style.cursor = "grab";
        // The advice belonged to where the balls were, so it goes with them.
        stopPlaying();
        result = null;
        picked = null;
        render();
      };
      ball.addEventListener("pointermove", move);
      ball.addEventListener("pointerup", up);
      ball.addEventListener("pointercancel", up);
    });
  }

  document.getElementById("table").addEventListener("pointerdown", (event) => {
    const colour = next();
    if (!colour) return;
    stopPlaying();
    layout[colour] = point(event, event.currentTarget);
    result = null; picked = null;
    render();
  });

  function point(event, svg) {
    const box = svg.getBoundingClientRect();
    const scale = (L + 300) / box.width;
    return [
      Math.max(R, Math.min(L - R, (event.clientX - box.left) * scale - 150)),
      Math.max(R, Math.min(W - R, (event.clientY - box.top) * scale - 150)),
    ];
  }

  function firstBallButtons() {
    // 수구가 정해져야 1적구 후보가 정해진다: 남은 두 공과 "자동".
    const box = document.getElementById("first-buttons");
    const wanted = ["any", ...ORDER.filter((c) => c !== cue)];
    if (!wanted.includes(wantFirst)) wantFirst = "any";
    box.textContent = "";
    for (const which of wanted) {
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("aria-pressed", String(which === wantFirst));
      button.innerHTML = which === "any" ? "자동"
        : `<span class="swatch" style="background:var(--ball-${which})"></span>${NAMES[which]}`;
      button.onclick = () => {
        wantFirst = which;
        stopPlaying(); result = null; picked = null; render();
      };
      box.appendChild(button);
    }
  }
  document.querySelectorAll("[data-face]").forEach((button) => {
    button.onclick = () => {
      wantFace = button.dataset.face;
      document.querySelectorAll("[data-face]").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.face === wantFace)));
      stopPlaying(); result = null; picked = null; render();
    };
  });

  function stopPlaying() {
    if (playing) { cancelAnimationFrame(playing.timer); playing = null; }
  }

  document.getElementById("play").onclick = () => {
    const row = chosenRow();
    if (!row) return;
    stopPlaying();
    const frames = row.hit.shot.paths[cue].length;
    let last = performance.now();
    playing = { frame: 0, timer: 0 };
    const tick = (now) => {
      // 60분의 1초에 한 칸씩, 실제 시간과 같은 속도로.
      const steps = Math.max(1, Math.round((now - last) / (1000 / 60)));
      last = now;
      playing.frame += steps;
      if (playing.frame >= frames - 1) { playing.frame = frames - 1; render(); stopPlaying(); render(); return; }
      render();
      playing.timer = requestAnimationFrame(tick);
    };
    playing.timer = requestAnimationFrame(tick);
  };

  document.getElementById("clear").onclick = () => {
    stopPlaying();
    layout = {}; result = null; picked = null; cue = "white"; render();
  };
  document.getElementById("run").onclick = () => {
    const button = document.getElementById("run");
    button.disabled = true;
    button.textContent = "계산 중…";
    // 한 프레임 쉬어 버튼 상태가 보이게 한 뒤 푼다.
    setTimeout(async () => {
      try {
        result = await advise((done) => {
          button.textContent = `계산 중 ${Math.round(done * 100)}%`;
        });
        picked = result.routes.length ? result.routes[0].key : null;
      } catch (e) {
        result = { routes: [], total: 0, kisses: 0 };
        console.error(e);
      } finally {
        button.textContent = "실행";
        render();
      }
    }, 30);
  };

  const COMMENT_KEY = "carom-assistant-comment";
  const comment = document.getElementById("comment");
  try { comment.value = localStorage.getItem(COMMENT_KEY) || ""; } catch (e) {}
  comment.oninput = () => { try { localStorage.setItem(COMMENT_KEY, comment.value); } catch (e) {} };

  document.getElementById("copy").onclick = async () => {
    // 배치까지 함께 담는다. 좌표가 있어야 같은 화면을 그대로 다시 만들어 볼 수 있다.
    const lines = [];
    const at = (colour) => layout[colour]
      ? `(${Math.round(layout[colour][0])}, ${Math.round(layout[colour][1])})` : "없음";
    lines.push("배치 (mm, 2844 x 1422):");
    for (const colour of ORDER) lines.push(`  ${NAMES[colour]} ${at(colour)}${colour === cue ? "  ← 수구" : ""}`);
    lines.push(`조건: 1적구 ${wantFirst === "any" ? "자동" : NAMES[wantFirst]} · 면 ${
      wantFace === "any" ? "자동" : (wantFace === "left" ? "왼쪽" : "오른쪽")}`);
    if (result && result.routes.length) {
      lines.push(`후보 ${result.routes.length}가지 (키스 제외 ${result.kisses}개):`);
      result.routes.forEach((row, index) => {
        lines.push(`  ${index + 1}. ${label(row)} — 여유 ${row.hit.room}° · `
          + `프로 ${row.chosen}/${result.total}명${row.chosen ? ` (득점 ${row.proRate}%)` : ""} · `
          + `1적구 ${Math.round(row.hit.pushed)} mm · 출발 ${Math.round(row.hit.deg)}° · `
          + `강도 ${SIM.strengthOf(row.hit.speed).toFixed(1)} · `
          + `두께 ${asThickness(row.hit.thickness)} · 당점 ${asTip(row.hit.side, row.hit.vertical || 0)} · `
          + `쿠션 ${row.hit.judged.rails.length}개${row.key === picked ? "   ← 선택됨" : ""}`);
      });
    } else if (result) {
      lines.push("후보: 없음");
    } else {
      lines.push("아직 실행하지 않음");
    }
    if (comment.value.trim()) lines.push("", "의견:", comment.value.trim());
    const said = document.getElementById("copied");
    try {
      await navigator.clipboard.writeText(lines.join("\n"));
      said.textContent = "복사됨 — 채팅창에 붙여넣어 주세요";
    } catch (e) {
      said.textContent = "복사 실패";
    }
    setTimeout(() => { said.textContent = ""; }, 4000);
  };

  render();
</script>
